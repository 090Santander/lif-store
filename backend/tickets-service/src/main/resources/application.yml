server:
  port: ${SERVER_PORT:8084}

spring:
  application:
    name: tickets-service
  datasource:
    url: "${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/lif_entradas?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}"
    username: ${SPRING_DATASOURCE_USERNAME:lif_app}
    password: ${SPRING_DATASOURCE_PASSWORD:lif_app}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: false
  flyway:
    enabled: true

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_URL:http://localhost:8761/eureka/}

app:
  security:
    jwt-secret: ${JWT_SECRET:dev-only-lif-store-secret-key-change-before-deploy-2026}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://127.0.0.1:5173}
  services:
    league-url: ${LEAGUE_SERVICE_URL:http://localhost:8082}

springdoc:
  swagger-ui:
    path: /swagger-ui.html

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
