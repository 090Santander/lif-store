<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Contacto | LIF Store</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
<link rel="stylesheet" href="css/estilos.css">
</head>
<body>

<nav class="navbar navbar-expand-lg navbar-lif">
  <div class="container">
    <a class="navbar-brand" href="index.html">LIF <span>Store</span></a>
    <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navMenu">
      <span class="navbar-toggler-icon"></span>
    </button>
    <div class="collapse navbar-collapse" id="navMenu">
      <ul class="navbar-nav mx-auto">
        <li class="nav-item"><a class="nav-link" href="index.html">Home</a></li>
        <li class="nav-item"><a class="nav-link" href="productos.html">Productos</a></li>
        <li class="nav-item"><a class="nav-link" href="nosotros.html">Nosotros</a></li>
        <li class="nav-item"><a class="nav-link" href="blogs.html">Blogs</a></li>
        <li class="nav-item"><a class="nav-link active" href="contacto.html">Contacto</a></li>
      </ul>
      <a href="carrito.html" class="carrito-link d-flex align-items-center gap-2">
        🛒 Cart (<span class="badge-carrito">0</span>)
      </a>
    </div>
  </div>
</nav>

<main class="container py-5">
  <div class="text-center mb-4">
    <img src="https://images.unsplash.com/photo-1614632537190-23e4146777db?w=90&q=80" class="rounded-circle mb-3" width="80" alt="Escudo LIF Store">
    <h1 class="h4 fw-oswald text-uppercase">LIF Store</h1>
  </div>

  <div class="row justify-content-center">
    <div class="col-md-6">
      <form id="form-contacto" class="form-lif" novalidate>
        <h2 class="h6 text-uppercase texto-rojo mb-4">Formulario de contacto</h2>

        <div class="mb-3">
          <label for="contacto-nombre" class="form-label">Nombre completo</label>
          <input type="text" id="contacto-nombre" class="form-control" maxlength="100">
          <div id="contacto-nombre-error" class="mensaje-error"></div>
        </div>

        <div class="mb-3">
          <label for="contacto-correo" class="form-label">Correo (opcional)</label>
          <input type="text" id="contacto-correo" class="form-control" maxlength="100" placeholder="nombre@duoc.cl">
          <div id="contacto-correo-error" class="mensaje-error"></div>
        </div>

        <div class="mb-4">
          <label for="contacto-comentario" class="form-label">Comentario</label>
          <textarea id="contacto-comentario" class="form-control" rows="4" maxlength="500"></textarea>
          <div id="contacto-comentario-error" class="mensaje-error"></div>
        </div>

        <button type="submit" class="btn btn-lif w-100">Enviar mensaje</button>
      </form>

      <div id="contacto-exito" class="alert alert-success text-center d-none" role="alert">
        ¡Gracias! Recibimos tu mensaje y te responderemos a la brevedad.
      </div>
    </div>
  </div>
</main>

<footer class="footer-lif">
  <div class="container">
    <div class="linea-copyright">© 2026 LIF Store — Proyecto académico DSY1104, Duoc UC.</div>
  </div>
</footer>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="js/datos.js"></script>
<script src="js/validaciones.js"></script>
<script src="js/carrito.js"></script>
<script src="js/app.js"></script>
<script>
  inicializarFormularioContacto();
</script>
</body>
</html>
