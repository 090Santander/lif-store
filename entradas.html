                <div class="collapse navbar-collapse" id="navbarLIF">
                    <ul class="navbar-nav mx-auto mb-2 mb-xl-0 small fw-bold">
                        <li class="nav-item"><a class="nav-link" href="index.html">Inicio</a></li>

            </div>

    <section class="hero-green text-white py-4 text-center">
        <div class="container py-2">
            <span class="badge bg-warning text-dark fw-bold px-3 py-1 rounded-pill text-uppercase mb-2">Boletería Oficial</span>
            <h1 class="fw-black display-6 mb-0">Compra tus e-Tickets</h1>
        </div>
    </section>

    <main class="container py-5 flex-grow-1">
        <h2 class="fw-bold mb-4">Próximos Partidos Disponibles</h2>
        
        <!-- CONTENEDOR DINÁMICO DE ENTRADAS -->
        <div id="contenedor-entradas" class="row g-4"></div>
    </main>

    <footer class="bg-dark-green text-white py-3 mt-auto">
        <div class="container text-center extra-small text-white-50">
            <p class="mb-0">© 2026 LIF - Liga Independiente de Fútbol. Todos los derechos reservados.</p>
        </div>
    </footer>

    <script src="assets/js/bootstrap.bundle.min.js"></script>
    <script src="assets/js/datos.js"></script>
    <script src="assets/js/carrito.js"></script>

    <script>
        function renderizarEntradas() {
            const contenedor = document.getElementById('contenedor-entradas');
            if (typeof obtenerPartidos !== 'function') return;

            const partidos = obtenerPartidos();

            if (!partidos || partidos.length === 0) {
                contenedor.innerHTML = `<div class="col-12"><div class="alert alert-info text-center rounded-4">No hay entradas disponibles en este momento.</div></div>`;
                return;
            }

            contenedor.innerHTML = partidos.map(p => `
                <div class="col-md-6 col-lg-6">
                    <div class="card border-0 shadow-sm rounded-4 h-100 overflow-hidden">
                        <div class="card-body p-4 d-flex flex-column justify-content-between">
                            <div>
                                <div class="d-flex justify-content-between align-items-center mb-2">
                                    <span class="badge bg-danger text-uppercase">${p.fase || 'OFICIAL'}</span>
                                    <small class="text-muted">📍 ${p.sede}</small>
                                </div>
                                <h3 class="fw-black fs-4 text-dark mb-1">${p.equipoLocal} vs ${p.equipoVisitante}</h3>
                                <p class="text-muted small mb-3">${p.descripcion || 'Entradas habilitadas para público general.'}</p>
                                <div class="bg-light p-2 rounded-3 text-center mb-3">
                                    <span class="fw-bold text-success d-block">${p.fecha}</span>
                                    <small class="text-muted">${p.hora}</small>
                                </div>
                            </div>
                            <div class="d-flex justify-content-between align-items-center pt-2 border-top">
                                <div>
                                    <small class="text-muted d-block">Entrada General</small>
                                    <span class="fs-4 fw-black text-dark">$${Number(p.precio).toLocaleString('es-CL')}</span>
                                </div>
                                <button onclick="agregarAlCarrito('${p.equipoLocal} vs ${p.equipoVisitante}', ${p.precio})" class="btn btn-warning rounded-pill px-4 fw-bold">Comprar e-Ticket</button>
                            </div>
                        </div>
                    </div>
                </div>
            `).join('');
        }

        document.addEventListener('DOMContentLoaded', renderizarEntradas);
    </script>
</body>
</html>
