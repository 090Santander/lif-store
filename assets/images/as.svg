    <path d="M 210,78 C 120,110 80,200 95,290 C 110,210 160,140 230,105 C 215,90 200,82 210,78 Z" />
    <path d="M 422,210 C 390,120 300,80 210,95 C 290,110 360,160 395,230 C 410,215 418,200 422,210 Z" />
    <path d="M 290,422 C 380,390 420,300 405,210 C 390,290 340,360 270,395 C 285,410 300,418 290,422 Z" />
    <path d="M 78,290 C 110,380 200,420 290,405 C 210,390 140,340 105,270 C 90,285 82,300 78,290 Z" />
  </g>

