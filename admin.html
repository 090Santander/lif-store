<!DOCTYPE ht<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Panel de Administración | LIF</title>
    <link rel="stylesheet" href="assets/css/bootstrap.min.css">
    <link rel="stylesheet" href="assets/css/estilos.css">
</head>
<body class="d-flex flex-column min-vh-100 bg-light">

    <header class="sticky-top">
        <nav class="navbar navbar-expand-xl navbar-dark bg-dark-green shadow-sm py-2">
            <div class="container-fluid px-lg-4">
                <a class="navbar-brand d-flex align-items-center gap-2" href="index.html">
                    <img src="assets/images/LOGO.png" alt="Logotipo LIF" class="logo-header">
                    <span class="fw-black fs-4 text-white">LIF Admin</span>
                </a>
                <a href="index.html" class="btn btn-sm btn-outline-light rounded-pill ms-auto">Volver al Sitio</a>
            </div>
        </nav>
    </header>

    <main class="container py-4 flex-grow-1">
        <h1 class="fw-bold mb-4">Panel de Administración</h1>

        <!-- NAV TABS -->
        <ul class="nav nav-tabs mb-4" id="adminTabs" role="tablist">
            <li class="nav-item" role="presentation">
                <button class="nav-link active fw-bold text-success" id="partidos-tab" data-bs-toggle="tab" data-bs-target="#tab-partidos" type="button">⚽ Partidos y Entradas</button>
            </li>
            <li class="nav-item" role="presentation">
                <button class="nav-link fw-bold text-success" id="jugadores-tab" data-bs-toggle="tab" data-bs-target="#tab-jugadores" type="button">🏃 Gestor de Jugadores</button>
            </li>
        </ul>

        <div class="tab-content" id="adminTabsContent">
            
            <!-- TAB 1: CREAR PARTIDOS (SE VEN EN ENTRADAS) -->
            <div class="tab-pane fade show active" id="tab-partidos" role="tabpanel">
                <div class="row g-4">
                    <div class="col-md-5">
                        <div class="card border-0 shadow-sm rounded-4 p-4">
                            <h3 class="fs-5 fw-bold mb-3">Agregar Nuevo Partido / Entrada</h3>
                            <form id="form-nuevo-partido">
                                <div class="mb-2">
                                    <label class="form-label small fw-bold">Equipo Local</label>
                                    <input type="text" id="p-local" class="form-control" required placeholder="Ej: Cracks FC">
                                </div>
                                <div class="mb-2">
                                    <label class="form-label small fw-bold">Equipo Visitante</label>
                                    <input type="text" id="p-visitante" class="form-control" required placeholder="Ej: Zánganos FC">
                                </div>
                                <div class="row g-2 mb-2">
                                    <div class="col-6">
                                        <label class="form-label small fw-bold">Fecha / Texto</label>
                                        <input type="text" id="p-fecha" class="form-control" required placeholder="SÁBADO 12 SEPT">
                                    </div>
                                    <div class="col-6">
                                        <label class="form-label small fw-bold">Hora</label>
                                        <input type="text" id="p-hora" class="form-control" required placeholder="16:00 hrs">
                                    </div>
                                </div>
                                <div class="row g-2 mb-2">
                                    <div class="col-6">
                                        <label class="form-label small fw-bold">Sede</label>
                                        <input type="text" id="p-sede" class="form-control" required placeholder="Sede Principal">
                                    </div>
                                    <div class="col-6">
                                        <label class="form-label small fw-bold">Fase / Categoría</label>
                                        <input type="text" id="p-fase" class="form-control" required placeholder="Gran Final">
                                    </div>
                                </div>
                                <div class="mb-2">
                                    <label class="form-label small fw-bold">Precio Entrada ($)</label>
                                    <input type="number" id="p-precio" class="form-control" min="0" required placeholder="5000">
                                </div>
                                <div class="mb-3">
                                    <label class="form-label small fw-bold">Descripción / Detalles</label>
                                    <textarea id="p-desc" class="form-control" rows="2" placeholder="Detalles del aforo o requisitos..."></textarea>
                                </div>
                                <button type="submit" class="btn btn-success w-100 rounded-pill fw-bold">Publicar Partido y Tickets</button>
                            </form>
                        </div>
                    </div>
                    <div class="col-md-7">
                        <div class="card border-0 shadow-sm rounded-4 p-4">
                            <h3 class="fs-5 fw-bold mb-3">Partidos Registrados</h3>
                            <ul id="lista-partidos-admin" class="list-group list-group-flush"></ul>
                        </div>
                    </div>
                </div>
            </div>

            <!-- TAB 2: AGREGAR Y VER JUGADORES -->
            <div class="tab-pane fade" id="tab-jugadores" role="tabpanel">
                <div class="row g-4">
                    <div class="col-md-5">
                        <div class="card border-0 shadow-sm rounded-4 p-4">
                            <h3 class="fs-5 fw-bold mb-3">Registrar Nuevo Jugador</h3>
                            <form id="form-nuevo-jugador">
                                <div class="mb-2">
                                    <label class="form-label small fw-bold">Nombre Completo</label>
                                    <input type="text" id="j-nombre" class="form-control" required placeholder="Ej: Juan Román">
                                </div>
                                <div class="mb-2">
                                    <label class="form-label small fw-bold">Equipo</label>
                                    <input type="text" id="j-equipo" class="form-control" required placeholder="Ej: Cracks FC">
                                </div>
                                <div class="row g-2 mb-3">
                                    <div class="col-6">
                                        <label class="form-label small fw-bold">Posición</label>
                                        <select id="j-posicion" class="form-select" required>
                                            <option value="Portero">Portero</option>
                                            <option value="Defensa">Defensa</option>
                                            <option value="Mediocampista">Mediocampista</option>
                                            <option value="Delantero">Delantero</option>
                                        </select>
                                    </div>
                                    <div class="col-6">
                                        <label class="form-label small fw-bold">Dorsal (#)</label>
                                        <input type="number" id="j-dorsal" class="form-control" min="1" max="99" required placeholder="10">
                                    </div>
                                </div>
                                <button type="submit" class="btn btn-success w-100 rounded-pill fw-bold">Guardar Jugador</button>
                            </form>
                        </div>
                    </div>
                    <div class="col-md-7">
                        <div class="card border-0 shadow-sm rounded-4 p-4">
                            <h3 class="fs-5 fw-bold mb-3">Plantel Registrado</h3>
                            <div class="table-responsive">
                                <table class="table table-hover align-middle">
                                    <thead>
                                        <tr>
                                            <th>#</th>
                                            <th>Jugador</th>
                                            <th>Equipo</th>
                                            <th>Posición</th>
                                        </tr>
                                    </thead>
                                    <tbody id="lista-jugadores-admin"></tbody>
                                </table>
                            </div>
                        </div>
                    </div>
                </div>
            </div>

        </div>
    </main>

    <script src="assets/js/bootstrap.bundle.min.js"></script>
    <script src="assets/js/datos.js"></script>
    <script>
        function cargarAdmin() {
            // Cargar partidos
            const partidos = obtenerPartidos();
            const listPartidos = document.getElementById('lista-partidos-admin');
            listPartidos.innerHTML = partidos.map(p => `
                <li class="list-group-item d-flex justify-content-between align-items-center">
                    <div>
                        <strong>${p.equipoLocal} vs ${p.equipoVisitante}</strong>
                        <div class="extra-small text-muted">${p.fecha} | ${p.sede}</div>
                    </div>
                    <span class="badge bg-success">$${p.precio.toLocaleString('es-CL')}</span>
                </li>
            `).join('');

            // Cargar jugadores
            const jugadores = obtenerJugadores();
            const listJugadores = document.getElementById('lista-jugadores-admin');
            listJugadores.innerHTML = jugadores.map(j => `
                <tr>
                    <td class="fw-bold">${j.dorsal}</td>
                    <td>${j.nombre}</td>
                    <td><span class="badge bg-secondary">${j.equipo}</span></td>
                    <td>${j.posicion}</td>
                </tr>
            `).join('');
        }

        document.getElementById('form-nuevo-partido').addEventListener('submit', (e) => {
            e.preventDefault();
            const nuevo = {
                equipoLocal: document.getElementById('p-local').value,
                equipoVisitante: document.getElementById('p-visitante').value,
                fecha: document.getElementById('p-fecha').value,
                hora: document.getElementById('p-hora').value,
                sede: document.getElementById('p-sede').value,
                fase: document.getElementById('p-fase').value,
                precio: Number(document.getElementById('p-precio').value),
                descripcion: document.getElementById('p-desc').value
            };
            guardarPartido(nuevo);
            e.target.reset();
            cargarAdmin();
            alert("¡Partido y entradas publicadas con éxito!");
        });

        document.getElementById('form-nuevo-jugador').addEventListener('submit', (e) => {
            e.preventDefault();
            const nuevo = {
                nombre: document.getElementById('j-nombre').value,
                equipo: document.getElementById('j-equipo').value,
                posicion: document.getElementById('j-posicion').value,
                dorsal: Number(document.getElementById('j-dorsal').value)
            };
            guardarJugador(nuevo);
            e.target.reset();
            cargarAdmin();
            alert("¡Jugador guardado con éxito!");
        });

        document.addEventListener('DOMContentLoaded', cargarAdmin);
    </script>
</body>
</html>
